name: Build Version Artifacts

# Manual builds only. Does NOT create GitHub Releases — download tarballs
# from the workflow run's Artifacts UI (Actions → run → Artifacts).
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versions to build (space-separated; leave empty to auto-detect missing upstream releases vs this repo)'
        required: false
        type: string

concurrency:
  group: build-releases-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Plan versions to build
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_VERSIONS: ${{ inputs.versions }}
        run: |
          python3 <<'PY'
          import json, os, importlib.machinery, importlib.util
          from pathlib import Path

          out = Path(os.environ["GITHUB_OUTPUT"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          raw = (os.environ.get("INPUT_VERSIONS") or "").strip()

          if raw:
              versions = raw.split()
          else:
              path = Path("create_releases").resolve()
              loader = importlib.machinery.SourceFileLoader("create_releases", str(path))
              spec = importlib.util.spec_from_loader(loader.name, loader)
              assert spec is not None and spec.loader is not None
              mod = importlib.util.module_from_spec(spec)
              loader.exec_module(mod)
              versions = mod.versions_to_build([])

          payload = json.dumps(versions)
          print(f"Versions to build: {payload}")
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"versions={payload}\n")
              fh.write(f"empty={'true' if not versions else 'false'}\n")
          with summary.open("a", encoding="utf-8") as fh:
              fh.write("## Build plan\n\n")
              if versions:
                  fh.write("Will build (workflow artifacts only — no GitHub Releases):\n\n")
                  for v in versions:
                      fh.write(f"- `{v}`\n")
              else:
                  fh.write("Nothing to do.\n")
          PY

  build:
    needs: plan
    if: needs.plan.outputs.empty != 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
        config:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build buildenv image (native arch)
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          docker build --build-arg "TARGETARCH=${ARCH}" -t tesseract-buildenv:local .

      - name: Install mise tools (uv)
        uses: jdx/mise-action@v2

      - name: Build tarball (no smoke — upload first)
        env:
          SKIP_IMAGE_BUILD: "1"
          IMAGE_NAME: tesseract-buildenv
          IMAGE_TAG: local
          TARGETS: ${{ matrix.config.target }}
        run: ./create_releases --skip-smoke "${{ matrix.version }}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: tesseract-${{ matrix.version }}-${{ matrix.config.target }}
          path: target/${{ matrix.config.target }}/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Smoke test package
        if: success()
        env:
          TARGETS: ${{ matrix.config.target }}
        run: ./create_releases --smoke-only "${{ matrix.version }}"

      - name: List artifacts
        if: always()
        run: find target -type f -exec ls -lh {} \; || true
